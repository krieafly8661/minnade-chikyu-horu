<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>みんなで地球を掘る</title>
<meta name="description" content="世界でひとつの穴を、ひとり1mずつ掘る。あなたが何人目かで、掘る深さが決まる。地球の反対側まで12,742km。">
<style>
:root { --bg: #f4efe6; --surface: #fffdf8; --fg: #2a2219; --muted: #75685a; --line: #dfd4c3; --accent: #c2410c; --accent-fg: #fff; --hi: #1d6fd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17130f; --surface: #221c16; --fg: #f1e9de; --muted: #b5a693; --line: #3a3027; --accent: #f08a4b; --accent-fg: #17130f; --hi: #7fb2ff; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #17130f; --surface: #221c16; --fg: #f1e9de; --muted: #b5a693; --line: #3a3027; --accent: #f08a4b; --accent-fg: #17130f; --hi: #7fb2ff; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.app { max-width: 540px; margin: 0 auto; padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
h1 { margin: 0; font-size: 26px; }
.total { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 2px solid var(--fg); border-radius: 14px; padding: 12px 14px; }
.total .num { font-size: 30px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
.total .sub { font-size: 14px; color: var(--muted); }
.prog { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); min-width: 2px; }
canvas { display: block; width: 100%; border-radius: 14px; }
.btn { font: inherit; font-weight: 800; border-radius: 14px; padding: 14px; border: 2px solid var(--fg); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-size: 20px; padding: 18px; }
.btn.dark { background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; } .row .btn { flex: 1; }
.card { background: var(--surface); border: 2px solid var(--fg); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 4px 4px 0 var(--fg); }
.card .who { font-size: 15px; color: var(--muted); }
.card .depth { font-size: 30px; font-weight: 800; line-height: 1.2; }
.card dl { margin: 0; display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 10px; font-size: 15px; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-weight: 700; }
.badge { background: var(--accent); color: var(--accent-fg); border-radius: 10px; padding: 8px 12px; font-weight: 800; }
.small { font-size: 13px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
ol.ms { margin: 0; padding: 0; list-style: none; font-size: 14px; }
ol.ms li { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
ol.ms li.done { color: var(--muted); }
ol.ms li.done b::after { content: " ✓"; color: var(--accent); }
ol.ms b { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <h1>みんなで地球を掘る</h1>
  <div class="total">
    <span class="sub">世界でひとつの穴。いまの深さ</span>
    <span class="num" id="totalNum">……</span>
    <div class="prog" aria-hidden="true"><i id="totalBar" style="width:0"></i></div>
    <span class="sub" id="totalSub">ひとり1mずつ掘る。地球の反対側まで 12,742 km</span>
  </div>
  <canvas id="cv" aria-label="穴の断面"></canvas>
  <button class="btn primary" id="dig">ひと掘りする（10回タップ）</button>
  <p class="small" id="digHint" style="margin:0;text-align:center">あなたが何人目かで、掘る深さが決まる</p>

  <section class="card" id="card" hidden>
    <span class="who" id="cWho"></span>
    <span class="depth" id="cDepth"></span>
    <div class="badge" id="cBadge" hidden></div>
    <dl>
      <dt>ここの地層</dt><dd id="cLayer"></dd>
      <dt>地温（目安）</dt><dd id="cTemp"></dd>
      <dt>見つけたもの</dt><dd id="cFind"></dd>
      <dt>次の節目</dt><dd id="cNext"></dd>
    </dl>
    <div class="row"><button class="btn dark" id="share">Xに投稿</button><button class="btn" id="zoom">地球ごと見る</button></div>
  </section>
  <p class="note" id="offline" hidden>いまは共有の穴につながらないので、この端末だけの穴を掘っています。</p>

  <section>
    <h2 style="font-size:18px;margin:8px 0">これからの節目</h2>
    <ol class="ms" id="ms"></ol>
  </section>
  <p class="small">深さと地温は、ふつうの地球の目安です。場所によってちがいます。カウンターは外部の無料サービス（abacus）を使い、送るのは「1回掘った」ことだけです。</p>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const COUNTER = "https://abacus.jasoncameron.dev";
const NS = "minnade-chikyu-horu";
const KEY = new URLSearchParams(location.search).has("test") ? "hole-test" : "hole-v1"; // ?test digs a practice hole
const EARTH_R = 6371000, DIAMETER = 12742000;

// [depth m, what is there]. The person whose metre contains this depth reaches it.
const MILESTONES = [
  [1, "最初のひと掘り"],
  [42, "大江戸線・六本木駅のホームくらいの深さ"],
  [240, "青函トンネルのいちばん深いところ（海面下240m）"],
  [333, "東京タワーの高さぶん"],
  [634, "東京スカイツリーの高さぶん"],
  [1000, "温泉を掘るときによくある深さ"],
  [3776, "富士山の高さぶん"],
  [4000, "世界でいちばん深い金鉱山くらい"],
  [8849, "エベレストの高さぶん"],
  [10920, "マリアナ海溝のいちばん深いところと同じ"],
  [12262, "人類が実際に掘った最深記録（コラ超深度掘削坑）に並んだ"],
  [12263, "人類の最深記録をこえた"],
  [30000, "日本の下の地殻の底（モホ面）あたり。ここからマントル"],
  [150000, "ダイヤモンドができるくらいの深さ"],
  [660000, "上部マントルの底"],
  [2900000, "核に届いた。ここから液体の鉄"],
  [5150000, "内核に届いた。固体の鉄"],
  [6371000, "地球の中心"],
  [12742000, "地球の反対側に出た（日本の反対側は、ブラジル沖の大西洋）"],
];
// [from m, name, colour, finds]
const LAYERS = [
  [0, "表土", "#7a5a3a", ["ミミズ", "ビー玉", "古い瓦のかけら", "どんぐり", "セミの幼虫"]],
  [2, "粘土と砂の層", "#a07a4a", ["貝がら", "わき出る地下水", "土器のかけら", "大昔の木の根"]],
  [30, "砂利と古い地層", "#8c7a5c", ["丸い川の石", "ナウマンゾウの歯の化石", "木の葉の化石", "火山灰の白い層"]],
  [300, "かたい堆積岩", "#6e6458", ["アンモナイトの化石", "三葉虫の化石", "黒い石炭のすじ", "石油のにおい"]],
  [3000, "花崗岩の地殻", "#8a7f84", ["石英の結晶", "熱い水", "ごく小さな金のつぶ", "雲母のきらきら"]],
  [30000, "上部マントル（かんらん岩）", "#5d6b3a", ["緑のかんらん石（ペリドット）", "ゆっくり流れる岩", "ざくろ石"]],
  [150000, "上部マントル（深部）", "#56603a", ["ダイヤモンドの原石", "ゆっくり流れる岩", "緑のかんらん石"]],
  [660000, "下部マントル", "#7a4a2a", ["ブリッジマナイト（地球でいちばん多い鉱物）", "ものすごい圧力"]],
  [2900000, "外核（液体の鉄）", "#c9661e", ["とけた鉄の流れ", "地球の磁場のみなもと"]],
  [5150000, "内核（固体の鉄）", "#e3a12a", ["太陽の表面くらい熱い鉄", "ぎゅっと固まった鉄"]],
  [6371000, "地球の反対側へ（ふたたび内核）", "#e3a12a", ["ここから上り坂", "固体の鉄"]],
];
// temperature guide [depth m, °C]
const TEMPS = [[0, 15], [1000, 45], [12262, 190], [30000, 600], [150000, 1300], [660000, 1900], [2900000, 3700], [5150000, 5000], [6371000, 5400]];

function layerAt(d) {
  const x = d > EARTH_R ? DIAMETER - d : d; // the far side mirrors the near side
  let L = LAYERS[0];
  for (const l of LAYERS) if (x >= l[0] && l[0] < EARTH_R) L = l;
  if (d > EARTH_R && x < 3000) return ["海の底の岩（反対側）", "#41607a", ["大西洋の海水", "深海の泥"]];
  return [L[1], L[2], L[3]];
}
function tempAt(d) {
  const x = d > EARTH_R ? DIAMETER - d : d;
  for (let i = 1; i < TEMPS.length; i++) if (x <= TEMPS[i][0]) { const [a, ta] = TEMPS[i - 1], [b, tb] = TEMPS[i]; return Math.round(lerp(ta, tb, (x - a) / (b - a))); }
  return 5400;
}
const fmt = (n) => n.toLocaleString("ja-JP");
function fmtDepth(m) { return m < 10000 ? fmt(m) + " m" : (m / 1000).toLocaleString("ja-JP", { maximumFractionDigits: 3 }) + " km"; }

// ---------- counter ----------
let total = 0, online = true, mine = null;
async function getTotal() {
  try {
    const r = await fetch(COUNTER + "/get/" + NS + "/" + KEY, { cache: "no-store" });
    if (r.status === 404) return 0;
    const j = await r.json(); if (typeof j.value !== "number") throw 0;
    return j.value;
  } catch (e) { online = false; return localTotal(); }
}
async function hit() {
  if (online) {
    try { const r = await fetch(COUNTER + "/hit/" + NS + "/" + KEY, { cache: "no-store" }); const j = await r.json(); if (typeof j.value === "number") return j.value; } catch (e) {}
    online = false;
  }
  const n = localTotal() + 1; try { localStorage.setItem("horu.local", n); } catch (e) {}
  return n;
}
function localTotal() { try { return +localStorage.getItem("horu.local") || 0; } catch (e) { return 0; } }

function showTotal() {
  $("totalNum").textContent = "地下 " + fmtDepth(total);
  $("totalBar").style.width = clamp(total / DIAMETER * 100, 0, 100) + "%";
  const next = MILESTONES.find((m) => m[0] > total);
  $("totalSub").textContent = fmt(total) + "人が掘った" + (next ? "。次の「" + next[1].split("。")[0].replace(/（.*?）/g, "") + "」まであと " + fmt(next[0] - total) + "人" : "");
  $("ms").innerHTML = MILESTONES.filter((m, i) => m[0] > 1).map((m) => "<li class=\"" + (total >= m[0] ? "done" : "") + "\"><b>" + fmtDepth(m[0]) + "</b><span>" + m[1] + "</span></li>").join("");
  $("offline").hidden = online;
}

// ---------- canvas ----------
let W = 0, H = 0, DPR = 1, taps = 0, digging = false, view = "near", zoomT = 0, chips = [];
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = Math.round(Math.min(W * 1.05, 520)); cv.width = W * DPR; cv.height = H * DPR; cv.style.height = H + "px"; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize);

function draw(now) {
  const focus = mine ? mine : total + 1; // the metre in view
  if (view === "far") zoomT = Math.min(1, zoomT + 0.02); else zoomT = Math.max(0, zoomT - 0.04);
  if (zoomT < 1) drawNear(focus, now);
  if (zoomT > 0) { ctx.globalAlpha = zoomT; drawEarth(focus); ctx.globalAlpha = 1; }
}
function drawNear(focus, now) {
  // 1 metre = 46 px; we look at about the metre being dug and the ones above
  const px = 46, topD = focus - (H * 0.55) / px;
  const yOf = (d) => (d - topD) * px;
  // sky if near the surface
  ctx.fillStyle = "#a9d4ef"; ctx.fillRect(0, 0, W, H);
  const step = 0.5;
  for (let d = Math.floor(topD / step) * step; d < topD + H / px; d += step) {
    if (d < 0) continue;
    const [, col] = layerAt(Math.max(0, d));
    ctx.fillStyle = col; ctx.fillRect(0, yOf(d), W, step * px + 1);
    // texture: small stones at stable positions
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    for (let i = 0; i < 6; i++) { const h = Math.sin((Math.floor(d / step) * 7 + i) * 12.9898) * 43758.5453; const fx = h - Math.floor(h); ctx.beginPath(); ctx.arc(fx * W, yOf(d) + ((i * 37) % 23), 2 + (i % 3), 0, Math.PI * 2); ctx.fill(); }
  }
  if (topD < 0) { ctx.fillStyle = "#6aa84f"; ctx.fillRect(0, yOf(0) - 6, W, 6); }
  // the shaft
  const sw = Math.min(120, W * 0.28), sx = W / 2 - sw / 2;
  const dugTo = mine ? mine : total + (digging ? taps / 10 : 0);
  ctx.fillStyle = "#1c1612";
  ctx.fillRect(sx, yOf(Math.max(0, topD)), sw, yOf(dugTo) - yOf(Math.max(0, topD)));
  // your metre
  const segTop = focus - 1;
  ctx.strokeStyle = "#f6c34a"; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
  ctx.strokeRect(sx - 6, yOf(segTop), sw + 12, px);
  ctx.setLineDash([]);
  ctx.fillStyle = "#fffdf8"; ctx.font = "800 14px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(mine ? "あなたの1m" : "次に掘る1m", sx + sw + 12, yOf(segTop) + px * 0.6);
  // depth ruler
  ctx.textAlign = "right"; ctx.font = "700 12px sans-serif";
  for (let d = Math.ceil(Math.max(0, topD)); d < topD + H / px; d++) {
    ctx.fillStyle = "rgba(255,253,248,0.85)"; ctx.fillRect(sx - 14, yOf(d), 8, 2);
    ctx.fillStyle = "#fffdf8"; ctx.fillText(fmt(d) + "m", sx - 18, yOf(d) + 4);
  }
  // drill
  const dy = yOf(dugTo);
  ctx.fillStyle = "#cfd4da"; ctx.fillRect(W / 2 - 4, Math.max(0, dy - 140), 8, Math.min(140, dy));
  ctx.fillStyle = "#e9edf1";
  ctx.beginPath(); ctx.moveTo(W / 2 - 18, dy - 22); ctx.lineTo(W / 2 + 18, dy - 22); ctx.lineTo(W / 2, dy + 6); ctx.closePath(); ctx.fill();
  if (digging) { ctx.strokeStyle = "#1c1612"; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { const y = dy - 18 + i * 7 + (now / 30 % 7); ctx.beginPath(); ctx.moveTo(W / 2 - 14 + i * 4, y); ctx.lineTo(W / 2 + 14 - i * 4, y + 3); ctx.stroke(); } }
  chips.forEach((c) => { c.x += c.vx; c.y += c.vy; c.vy += 0.4; c.life -= 0.03; ctx.fillStyle = layerAt(focus)[1]; ctx.fillRect(c.x, c.y, 5, 5); });
  chips = chips.filter((c) => c.life > 0);
}
function drawEarth(focus) {
  ctx.fillStyle = "#0f1622"; ctx.fillRect(0, 0, W, H);
  const R = Math.min(W, H) * 0.42, cx = W / 2, cy = H / 2 + 10;
  const rings = [[0, "#3f6b8f"], [30000, "#5d6b3a"], [660000, "#7a4a2a"], [2900000, "#c9661e"], [5150000, "#e3a12a"]];
  rings.forEach(([d, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, R * (1 - d / EARTH_R), 0, Math.PI * 2); ctx.fill(); });
  // Japan at the top, the hole goes straight down
  const len = R * 2 * clamp(total / DIAMETER, 0, 1);
  ctx.strokeStyle = "#f6c34a"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy - R + Math.max(len, 1)); ctx.stroke();
  ctx.fillStyle = "#f6c34a"; ctx.beginPath(); ctx.arc(cx, cy - R + len, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fffdf8"; ctx.font = "800 14px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("日本", cx, cy - R - 8);
  ctx.fillText("ブラジル沖", cx, cy + R + 18);
  ctx.font = "700 13px sans-serif";
  const pct = total / DIAMETER * 100;
  ctx.fillText("ここまで " + (pct < 0.001 ? pct.toExponential(1) : pct.toFixed(4)) + "%。穴は細すぎて見えないくらい", cx, 22);
}

function loop(now) { draw(now); requestAnimationFrame(loop); }

// ---------- digging ----------
async function tap() {
  if (mine && !digging) return;
  if (!digging) { digging = true; taps = 0; view = "near"; }
  taps++;
  for (let i = 0; i < 6; i++) chips.push({ x: W / 2, y: H * 0.55, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, life: 1 });
  $("dig").textContent = taps < 10 ? "掘っている… " + taps + " / 10" : "掘れた！";
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  if (taps >= 10) {
    $("dig").disabled = true;
    const n = await hit();
    digging = false; mine = n; total = Math.max(total, n);
    showTotal(); showCard(n);
    $("dig").textContent = "掘りおわった";
  }
}
function showCard(n) {
  const d0 = n - 1, d1 = n;
  const [layer, , finds] = layerAt(d1 - 0.5);
  // the find is fixed by the number, so the same person always gets the same thing
  const h = Math.abs(Math.sin(n * 91.345) * 10000);
  const find = finds[Math.floor((h - Math.floor(h)) * finds.length)];
  const ms = MILESTONES.find((m) => m[0] > d0 && m[0] <= d1);
  const kiri = !ms && n % 1000 === 0;
  const next = MILESTONES.find((m) => m[0] > d1);
  $("cWho").textContent = fmt(n) + "人目" + (online ? "" : "（この端末だけの穴）");
  $("cDepth").textContent = "地下 " + fmt(d0) + "〜" + fmt(d1) + " m を掘った";
  $("cBadge").hidden = !(ms || kiri);
  $("cBadge").textContent = ms ? "節目：" + ms[1] : kiri ? "1,000人ごとの区切り。記念の杭を打った" : "";
  $("cLayer").textContent = layer;
  $("cTemp").textContent = "約 " + fmt(tempAt(d1)) + "℃";
  $("cFind").textContent = find;
  $("cNext").textContent = next ? next[1].split("。")[0].replace(/（.*?）/g, "") + "まで あと " + fmt(next[0] - d1) + "人" : "反対側に着いた";
  $("card").hidden = false;
  $("share").onclick = () => {
    const text = "みんなで地球を掘る｜私は" + fmt(n) + "人目。地下" + fmt(d0) + "〜" + fmt(d1) + "mを掘った（地温 約" + fmt(tempAt(d1)) + "℃）\n見つけたもの：" + find +
      (ms ? "\n節目：" + ms[1] : "") + (next ? "\n" + next[1].split("。")[0].replace(/（.*?）/g, "") + "まで あと" + fmt(next[0] - d1) + "人" : "") + "\n#みんなで地球を掘る";
    open("https://x.com/intent/post?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(location.href.split("#")[0]), "_blank", "noopener");
  };
  try { localStorage.setItem("horu.mine", JSON.stringify({ n, online })); } catch (e) {}
}
$("dig").addEventListener("click", tap);
$("zoom").addEventListener("click", () => { view = view === "far" ? "near" : "far"; $("zoom").textContent = view === "far" ? "穴にもどる" : "地球ごと見る"; });

(async function init() {
  resize();
  requestAnimationFrame(loop);
  total = await getTotal();
  showTotal();
})();
</script>
</body>
</html>
